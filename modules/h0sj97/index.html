  .modulex-iletisim-sube-sekme-ss-sekme { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; margin-block-end: -1px; padding-block: 10px; padding-inline: 18px 20px; border: 1px solid --cizgi--; border-block-end-color: transparent; border-start-start-radius: 14px; border-start-end-radius: 14px; background: color-mix(in srgb, --text-- 4%, --bg--); color: --muted--; font: inherit; font-weight: 700; transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease; }

  .modulex-iletisim-sube-sekme-ss-kroki { position: relative; display: grid; place-items: center; overflow: hidden; min-block-size: 220px; border-radius: calc(--yuvarlak-- - 4px); background-color: color-mix(in srgb, --accent-- 10%, --bg--); background-image: linear-gradient(115deg, transparent 46%, color-mix(in srgb, --text-- 9%, transparent) 46% 54%, transparent 54%), linear-gradient(25deg, transparent 62%, color-mix(in srgb, --text-- 7%, transparent) 62% 67%, transparent 67%), radial-gradient(circle at 70% 30%, color-mix(in srgb, --accent-- 22%, transparent) 0 14%, transparent 15%); }
  .modulex-iletisim-sube-sekme-ss-isaret { display: inline-grid; place-items: center; inline-size: 64px; block-size: 64px; border-radius: 50% 50% 50% 0; background: --accent--; color: --accentText--; transform: rotate(-45deg); box-shadow: 0 14px 24px -12px color-mix(in srgb, --text-- 60%, transparent); animation: modulex-iletisim-sube-sekme-ss-dus 0.7s cubic-bezier(0.3, 1.4, 0.5, 1) both; }
  .modulex-iletisim-sube-sekme-ss-isaret .material-symbols-outlined { font-size: 30px; transform: rotate(45deg); }
  @keyframes modulex-iletisim-sube-sekme-ss-dus { from { opacity: 0; transform: translateY(-30px) rotate(-45deg); } to { opacity: 1; transform: rotate(-45deg); } }
  .modulex-iletisim-sube-sekme-ss-pgov { display: grid; gap: 10px; min-width: 0; }
  .modulex-iletisim-sube-sekme-ss-pad { color: --accentInk--; font-size: 0.85rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
  .modulex-iletisim-sube-sekme-ss-adres { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.3rem, 2.4vw, 1.9rem); font-weight: 750; line-height: 1.3; overflow-wrap: anywhere; }
  .modulex-iletisim-sube-sekme-ss-ortak { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; }
  .modulex-iletisim-sube-sekme-ss-ok2 { display: flex; align-items: center; gap: 14px; min-width: 0; padding: 14px 16px; border-radius: 14px; background: --kartBg--; transition: transform 0.25s ease, box-shadow 0.25s ease; }
  .modulex-iletisim-sube-sekme-ss-ok2:hover { transform: translateY(-3px); box-shadow: 0 14px 28px -22px color-mix(in srgb, --text-- 60%, transparent); }
  .modulex-iletisim-sube-sekme-ss-ogov { display: grid; min-width: 0; }
  @media (max-width: 768px) {
    .modulex-iletisim-sube-sekme-ss-panel { grid-template-columns: minmax(0, 1fr); }
    .modulex-iletisim-sube-sekme-ss-kroki { min-block-size: 150px; }
    .modulex-iletisim-sube-sekme-ss-sekmeler { padding-inline: 0; }
    .modulex-iletisim-sube-sekme-ss-sekme { flex: 1 1 auto; justify-content: center; }
  }
  .modulex-iletisim-sube-sekme-kikon { flex: none; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, --accent-- 14%, transparent); color: --accentInk--; font-size: 24px; }
  .modulex-iletisim-sube-sekme-ketiket { display: block; color: --muted--; font-size: 0.82rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
  .modulex-iletisim-sube-sekme-deger { color: inherit; font-weight: 650; text-decoration: none; overflow-wrap: anywhere; transition: color 0.2s ease; }
  a.modulex-iletisim-sube-sekme-deger:hover { color: --accentInk--; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-iletisim-sube-sekme-eylem { display: inline-flex; align-items: center; gap: 6px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.2s ease; }
  .modulex-iletisim-sube-sekme-eylem:hover { gap: 10px; }
  .modulex-iletisim-sube-sekme-eylem .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-sube-sekme-kopya { display: none; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: --text--; font: inherit; font-size: 0.85rem; font-weight: 650; transition: border-color 0.2s ease, background 0.2s ease; }
  .modulex-iletisim-sube-sekme--kjs .modulex-iletisim-sube-sekme-kopya { display: inline-flex; }
  .modulex-iletisim-sube-sekme-kopya:hover { border-color: --accent--; }
  .modulex-iletisim-sube-sekme-kopya .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-sube-sekme--kopyalandi { background: color-mix(in srgb, --accent-- 14%, transparent); }
  .modulex-iletisim-sube-sekme-sosyal { display: grid; gap: 10px; }
  .modulex-iletisim-sube-sekme-sbaslik { color: --muted--; font-size: 0.9rem; font-weight: 650; }
  .modulex-iletisim-sube-sekme-sliste { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-iletisim-sube-sekme-cip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-weight: 650; text-decoration: none; transition: border-color 0.2s ease, transform 0.2s ease; }
  .modulex-iletisim-sube-sekme-cip:hover { border-color: --accent--; transform: translateY(-2px); }
  .modulex-iletisim-sube-sekme-cikon { font-size: 18px; }
  .modulex-iletisim-sube-sekme-harita { position: relative; overflow: hidden; min-height: 280px; border-radius: --yuvarlak--; background: --kartBg--; }
  .modulex-iletisim-sube-sekme-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .modulex-iletisim-sube-sekme-hdesen { position: absolute; inset: 0; display: grid; place-items: center; background-color: color-mix(in srgb, --accent-- 8%, --kartBg--); background-image: linear-gradient(color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), radial-gradient(circle at 30% 40%, color-mix(in srgb, --accent-- 18%, transparent) 0 18%, transparent 19%); background-size: 36px 36px, 36px 36px, 100% 100%; }
  .modulex-iletisim-sube-sekme-pin { color: --accentInk--; font-size: 56px; animation: modulex-iletisim-sube-sekme-zipla 2.4s ease-in-out infinite; }
  @keyframes modulex-iletisim-sube-sekme-zipla { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .modulex-iletisim-sube-sekme-hyol { position: absolute; inset-block-end: 16px; inset-inline-start: 16px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 999px; background: --bg--; color: --text--; font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px color-mix(in srgb, --text-- 16%, transparent); transition: transform 0.2s ease; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-sube-sekme :is(.modulex-iletisim-sube-sekme-baslik, .modulex-iletisim-sube-sekme-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-sube-sekme-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-iletisim-sube-sekme { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-iletisim-sube-sekme *, .modulex-iletisim-sube-sekme *::before, .modulex-iletisim-sube-sekme *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-iletisim-sube-sekme";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sekme = (s, P) => {
        const t = [...s.querySelectorAll("[role=tab]")];
        const p = [...s.querySelectorAll("[role=tabpanel]")];
        if (!t.length) return;
        s.classList.add(P + "--js");
        const sec = (i, odak) => {
          t.forEach((x, j) => { x.setAttribute("aria-selected", String(i === j)); x.tabIndex = i === j ? 0 : -1; });
          p.forEach((x, j) => { x.hidden = i !== j; });
          if (odak) t[i].focus();
        };
        sec(0);
        t.forEach((x, i) => {
          x.addEventListener("click", () => sec(i));
          x.addEventListener("keydown", (e) => {
            const rtl = getComputedStyle(s).direction === "rtl";
            const ileri = rtl ? "ArrowLeft" : "ArrowRight";
            const geri = rtl ? "ArrowRight" : "ArrowLeft";
            let n = -1;
            if (e.key === ileri || e.key === "ArrowDown") n = (i + 1) % t.length;
            else if (e.key === geri || e.key === "ArrowUp") n = (i - 1 + t.length) % t.length;
            else if (e.key === "Home") n = 0;
            else if (e.key === "End") n = t.length - 1;
            if (n > -1) { e.preventDefault(); sec(n, true); }
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sekme(s, P, az);
    });
  })();
</script>
